<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Rayo -->
    <path id="rayo" d="M34 0 L2 52 H24 L10 100 L56 38 H32 L48 0 Z"/>

    <!-- Libro cerrado con lomo y lineas de titulo -->
    <g id="libro">
      <rect x="0" y="0" width="64" height="84" rx="9"/>
      <path d="M16 2 V82" fill="none"/>
      <path d="M30 24 H52 M30 36 H46" fill="none"/>
    </g>

    <!-- Libro cerrado con carita -->
    <g id="libro-cara">
      <rect x="0" y="0" width="64" height="84" rx="9"/>
      <path d="M16 2 V82" fill="none"/>
      <circle cx="31" cy="38" r="3.5" stroke="none" fill="#fff" fill-opacity=".5"/>
      <circle cx="49" cy="38" r="3.5" stroke="none" fill="#fff" fill-opacity=".5"/>
      <path d="M31 50 Q40 60 49 50" fill="none"/>
    </g>

    <!-- Libro abierto -->
    <g id="abierto">
      <path d="M0 18 Q30 2 60 16 Q90 2 120 18 V82 Q90 66 60 80 Q30 66 0 82 Z"/>
      <path d="M60 16 V80" fill="none"/>
      <path d="M14 36 Q28 30 46 34 M14 50 Q28 44 46 48 M74 34 Q92 30 106 36 M74 48 Q92 44 106 50" fill="none" stroke-width="3.5"/>
    </g>

    <!-- Pila de libros -->
    <g id="pila">
      <rect x="6" y="0" width="84" height="22" rx="7"/>
      <rect x="0" y="26" width="96" height="22" rx="7"/>
      <rect x="10" y="52" width="80" height="22" rx="7"/>
      <path d="M18 11 H40 M12 37 H34 M22 63 H44" fill="none" stroke-width="3.5"/>
    </g>

    <!-- Chispa -->
    <path id="chispa" d="M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12 Z"/>
  </defs>

  <!-- Libros claros -->
  <g fill="#fff" fill-opacity=".10" stroke="#fff" stroke-opacity=".36" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <use href="#abierto" transform="translate(190 34) rotate(8)"/>
    <use href="#libro-cara" transform="translate(402 62) rotate(14)"/>
    <use href="#pila" transform="translate(34 236) rotate(-6)"/>
    <use href="#libro" transform="translate(432 384) rotate(10)"/>
  </g>

  <!-- Libros en gris azulado -->
  <g fill="#00d9ff" fill-opacity=".14" stroke="#7be9ff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <use href="#libro" transform="translate(332 232) rotate(-18)"/>
    <use href="#abierto" transform="translate(70 398) rotate(-8)"/>
    <use href="#libro-cara" transform="translate(236 410) rotate(-10) scale(.85)"/>
  </g>

  <!-- Rayos -->
  <g fill="#ffd60a" fill-opacity=".30" stroke="#ffd60a" stroke-opacity=".80" stroke-width="4" stroke-linejoin="round">
    <use href="#rayo" transform="translate(56 40) rotate(-12) scale(1.1)"/>
    <use href="#rayo" transform="translate(236 196) rotate(15) scale(.7)"/>
    <use href="#rayo" transform="translate(358 372) rotate(10) scale(.8)"/>
    <use href="#rayo" transform="translate(472 214) rotate(-14) scale(.6)"/>
  </g>

  <!-- Chispas -->
  <g fill="#fff" fill-opacity=".38">
    <use href="#chispa" transform="translate(150 150)"/>
    <use href="#chispa" transform="translate(310 160) scale(.7)"/>
    <use href="#chispa" transform="translate(130 340) scale(.8)"/>
    <use href="#chispa" transform="translate(500 120) scale(.7)"/>
    <use href="#chispa" transform="translate(300 330) scale(.6)"/>
    <use href="#chispa" transform="translate(30 470) scale(.7)"/>
  </g>
</svg>
