{% extends "base.html" %}
{% load static %}
{% block cuerpo %}
<div class="acceso">
  <aside class="marca">
    <div class="marca-titulo">
      <svg class="marca-rayo" viewBox="0 0 58 102" aria-hidden="true"><path d="M34 1 L3 53 H25 L11 101 L56 38 H32 L48 1 Z"/></svg>
      <span class="marca-texto"><span class="t-blanco">Preu</span><span class="t-amarillo">-</span><span class="t-celeste">Fast</span></span>
    </div>
    <div class="marca-centro">
      <div class="marca-logo"><img src="{% static 'img/logo.png' %}" alt="Preu-Fast"></div>
    </div>
    <h1>{% block titular %}{% endblock %}</h1>
  </aside>
  <section class="formulario">
    <div class="caja">{% block formulario %}{% endblock %}</div>
  </section>
</div>
{% endblock %}
