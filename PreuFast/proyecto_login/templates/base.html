#este codigo es un template base para la aplicacion web, contiene el encabezado y el pie de pagina, ademas de los estilos CSS.
##este codigo si fue realizado por ia, debido a que no se escrubir en lenguaje CSS
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Mi aplicación{% endblock %}</title>
  <style>
    :root {
      --tinta: #17212b; --fondo: #f5f6f4; --panel: #17324d; --acento: #f2b134;
      --borde: #c4ccd3; --error: #b3261e; --error-fondo: #fdecea;
      --ok: #1d6b4a; --ok-fondo: #e6f4ec;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
           color: var(--tinta); background: var(--fondo); line-height: 1.5; }
    a { color: var(--panel); }

    /* Pantallas de acceso */
    .acceso { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .marca { background: var(--panel); color: #fff; padding: 3rem;
             display: flex; flex-direction: column; justify-content: space-between; gap: 3rem; }
    .marca .nombre { font-weight: 700; font-size: 1.1rem; border-left: 4px solid var(--acento); padding-left: .75rem; }
    .marca h1 { margin: 0; font-size: 2.6rem; line-height: 1.12; max-width: 14ch; }
    .formulario { display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .caja { width: 100%; max-width: 380px; }
    .caja h2 { margin: 0 0 1.5rem; font-size: 1.6rem; }

    /* Formularios */
    .campo { margin-bottom: 1.1rem; }
    .campo label { display: block; font-weight: 600; margin-bottom: .3rem; }
    .campo input { width: 100%; padding: .7rem .8rem; font: inherit; color: inherit;
                   background: #fff; border: 1px solid var(--borde); border-radius: 6px; }
    .campo input:focus-visible, .boton:focus-visible { outline: 3px solid var(--acento); outline-offset: 1px; }
    .campo small { display: block; margin-top: .35rem; color: #51606d; font-size: .85rem; }
    .campo small ul { margin: .25rem 0 0; padding-left: 1.1rem; }
    .campo .error { margin: .35rem 0 0; color: var(--error); font-size: .9rem; }
    .boton { display: block; width: 100%; text-align: center; text-decoration: none;
             padding: .75rem 1rem; font: inherit; font-weight: 700; cursor: pointer;
             color: var(--panel); background: var(--acento); border: 0; border-radius: 6px; }
    .boton:hover { filter: brightness(.95); }
    .boton-sec { display: inline-block; width: auto; color: var(--panel); background: transparent; border: 1px solid var(--panel); }
    .alterno { margin-top: 1.5rem; }

    /* Avisos */
    .alerta, .mensajes li { padding: .7rem .9rem; border-radius: 6px; margin-bottom: 1rem; list-style: none; }
    .alerta { background: var(--error-fondo); color: var(--error); }
    .alerta p { margin: 0; }
    .mensajes { margin: 0; padding: 0; }
    .mensajes .success { background: var(--ok-fondo); color: var(--ok); }
    .mensajes .error { background: var(--error-fondo); color: var(--error); }

    /* Página interna */
    .barra { display: flex; justify-content: space-between; align-items: center;
             padding: 1rem 2rem; background: var(--panel); color: #fff; }
    .barra .boton-sec { color: #fff; border-color: #fff; padding: .45rem .9rem; }
    .contenido { max-width: 640px; margin: 3rem auto; padding: 0 1.5rem; }
    .contenido h1 { margin: 0 0 .5rem; }
    .datos { display: grid; grid-template-columns: 10rem 1fr; gap: .6rem 1rem; margin-top: 2rem;
             padding-top: 1.5rem; border-top: 1px solid var(--borde); }
    .datos dt { font-weight: 600; } .datos dd { margin: 0; }

    .alerta-ok { padding: .7rem .9rem; border-radius: 6px; margin-bottom: 1rem;
                 background: var(--ok-fondo); color: var(--ok); }
    .alerta-ok p { margin: 0; }
    .barra div { display: flex; align-items: center; gap: 1rem; }

    /* Menú principal (prototipo) */
    .opciones { list-style: none; margin: 2rem 0 0; padding: 0; border-top: 1px solid var(--borde); }
    .opciones a { display: block; padding: 1rem .25rem; color: inherit; text-decoration: none;
                  border-bottom: 1px solid var(--borde); }
    .opciones a:hover, .opciones a:focus-visible { background: #e9edf0; }
    .opciones strong { display: block; }
    .opciones span { color: #51606d; font-size: .9rem; }
    .nota { margin-top: 1.5rem; color: #51606d; font-size: .9rem; }

    @media (max-width: 760px) {
      .acceso { grid-template-columns: 1fr; min-height: 0; }
      .marca { padding: 1.5rem; gap: 1.5rem; } .marca h1 { font-size: 1.7rem; }
      .datos { grid-template-columns: 1fr; gap: .1rem; } .datos dd { margin-bottom: .8rem; }
    }
  </style>
</head>
<body>
{% block cuerpo %}{% endblock %}
</body>
</html>
